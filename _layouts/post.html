---
layout: default
---

<article style="max-width: 800px; margin: 0 auto;">
  <h1 style="font-size: 38px; color: #F1F5F9; margin-bottom: 5px;">{{ page.title }}</h1>
  <p style="color: #64748B; font-size: 14px; margin-bottom: 30px;">
    📅 {{ page.date | date: "%B %d, %Y" }} &nbsp;|&nbsp; ⏱️ {{ page.reading_time | default: "2" }} min read
  </p>
  
  <div style="background: #1E293B; padding: 30px; border-radius: 20px; border: 1px solid #334155; line-height: 1.8; font-size: 17px;">
    {{ content }}
  </div>

  <a href="{{ site.baseurl }}/blog" style="display: inline-block; margin-top: 30px; color: #06B6D4; text-decoration: none;">← Back to Blog</a>
</article>
