---
layout: default
---

<article style="max-width: 800px; margin: 0 auto; padding-top: 20px;">
  <header style="margin-bottom: 30px;">
    <span class="pill" style="margin-bottom: 12px;">{{ page.date | date: "%B %d, %Y" }}</span>
    <h1 class="page-title">{{ page.title }}</h1>
  </header>
  
  <div class="panel" style="line-height: 1.8; font-size: 1.05rem;">
    {{ content }}
  </div>

  <div style="margin-top: 40px;">
    <a href="{{ site.baseurl }}/blog.html" class="btn-secondary">← Back to Updates</a>
  </div>
</article>
