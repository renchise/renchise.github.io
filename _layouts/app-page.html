---
layout: default
---

<header class="contact-header">
  <div style="display: flex; align-items: center; gap: 20px; margin-bottom: 20px;">
    <img class="app-logo" src="{{ site.baseurl }}{{ page.app_logo }}" alt="{{ page.app_name }} icon" style="width: 80px; height: 80px;">
    <div>
      <h1 class="page-title">{{ page.app_name }}</h1>
      <p class="lead" style="margin: 0;">{{ page.tagline }}</p>
    </div>
  </div>

  {% if page.nav_links %}
  <div class="policy-nav" style="margin-top:20px;">
    {% for link in page.nav_links %}
      <a href="{{ site.baseurl }}{{ link.url }}">{{ link.label }}</a>
    {% endfor %}
  </div>
  {% endif %}
</header>

<div class="panel">
  {{ content }}
</div>

{% if page.screenshots %}
<section class="section">
  <div class="section-head">
    <div>
      <h2>Screenshots</h2>
    </div>
  </div>
  <div class="screenshot-grid">
    {% for item in page.screenshots %}
      <figure class="screenshot">
        <div class="shot">
          <img class="zoomable" src="{{ site.baseurl }}{{ item.image }}" alt="{{ item.caption }}" />
        </div>
        <figcaption>{{ item.caption }}</figcaption>
      </figure>
    {% endfor %}
  </div>
</section>
{% endif %}
