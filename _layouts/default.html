<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
<meta name="google-site-verification" content="e6j1f0qBfo8oRTJyY7EM_q_HzcaQ_mvZtoLsKebyMSM" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0b1324" />
  <link rel="icon" href="{{ site.baseurl }}/assets/images/Renchise.png" />
  <link rel="stylesheet" href="{{ site.baseurl }}/assets/css/site.css" />
  <script src="https://cdn.jsdelivr.net/npm/particles.js@2.0.0/particles.min.js"></script>
  {% seo %}
  {% feed_meta %}
</head>
<body class="{% if page.url == '/' or page.url == '/index.html' %}is-home{% endif %}">
  <div id="particles-js" style="position:fixed; width:100%; height:100%; top:0; left:0; z-index:1; pointer-events:none;"></div>

  {% include navigation.html %}

  <main class="page">
    {{ content }}
  </main>

  <footer class="footer">
    <div class="footer-inner">
      <div><strong>Renchise</strong> · independent Android apps</div>
      <div>&copy; {{ site.time | date: "%Y" }} Renchise. All rights reserved.</div>
    </div>
  </footer>

  <div class="lightbox" id="lightbox" aria-hidden="true">
    <button class="close" id="lightboxClose" aria-label="Close preview">×</button>
    <img id="lightboxImg" alt="Preview" />
  </div>

  <script>
    (function(){
      const lb = document.getElementById('lightbox');
      const lbImg = document.getElementById('lightboxImg');
      const lbClose = document.getElementById('lightboxClose');
      function closeLB(){
        lb.classList.remove('open');
        lb.setAttribute('aria-hidden','true');
        lbImg.src = '';
      }
      document.querySelectorAll('img.zoomable, a.zoomable img').forEach(img => {
        img.addEventListener('click', function(){
          lbImg.src = this.dataset.full || this.src;
          lb.classList.add('open');
          lb.setAttribute('aria-hidden','false');
        });
      });
      lb.addEventListener('click', function(e){
        if(e.target === lb) closeLB();
      });
      lbClose.addEventListener('click', closeLB);
      document.addEventListener('keydown', function(e){
        if(e.key === 'Escape') closeLB();
      });

      // Global Particles Init
      function initParticles() {
        if (typeof particlesJS === 'undefined') {
          setTimeout(initParticles, 100);
          return;
        }

        const isMobile = window.innerWidth < 768;

        // Background Particles
        particlesJS('particles-js', {
          particles: {
            number: {
              value: isMobile ? 40 : 80,
              density: { enable: true, value_area: 1000 }
            },
            color: { value: ["#1E90FF", "#00BFFF", "#FF4500", "#FF6347", "#FFD700"] },
            shape: { type: ["circle", "triangle"] },
            opacity: {
              value: 0.4,
              random: true,
              anim: { enable: true, speed: 0.5, opacity_min: 0.1, sync: false }
            },
            size: {
              value: isMobile ? 2 : 3,
              random: true,
              anim: { enable: true, speed: 2, size_min: 0.5, sync: false }
            },
            line_linked: { enable: false },
            move: {
              enable: true,
              speed: 0.8,
              direction: "none",
              random: true,
              straight: false,
              out_mode: "out",
              bounce: false
            }
          },
          interactivity: {
            detect_on: "canvas",
            events: { resize: true },
            modes: {
              bubble: { distance: 100, size: 5, duration: 2, opacity: 0.8, speed: 3 }
            }
          },
          retina_detect: true
        });

        // Header Foreground Particles (Sparkling Stars)
        particlesJS('particles-header', {
          particles: {
            number: {
              value: isMobile ? 60 : 120,
              density: { enable: true, value_area: 500 }
            },
            color: { value: ["#ffffff", "#fff4d1", "#ffcc00"] },
            shape: {
              type: "star",
              stroke: { width: 0, color: "#000000" },
              polygon: { nb_sides: 5 }
            },
            opacity: {
              value: 0.9,
              random: true,
              anim: { enable: true, speed: 2.5, opacity_min: 0.1, sync: false } /* Fast twinkle */
            },
            size: {
              value: isMobile ? 2.5 : 4,
              random: true,
              anim: { enable: true, speed: 5, size_min: 0.5, sync: false }
            },
            line_linked: { enable: false },
            move: {
              enable: true,
              speed: 1.2, /* Slower, more graceful drift */
              direction: "none",
              random: true,
              straight: false,
              out_mode: "out",
              bounce: false
            }
          },
          interactivity: {
            detect_on: "canvas",
            events: {
              onhover: { enable: !isMobile, mode: "bubble" },
              onclick: { enable: true, mode: "push" },
              resize: true
            },
            modes: {
              bubble: { distance: 100, size: 6, duration: 2, opacity: 1, speed: 3 },
              push: { particles_nb: 4 }
            }
          },
          retina_detect: true
        });
      }
      initParticles();
    })();
  </script>
</body>
</html>
