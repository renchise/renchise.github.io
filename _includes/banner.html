<div class="banner-container">
  <div id="particles-js"></div>
  <div class="banner-content">
    <div class="banner-text-placeholder" aria-hidden="true">
      <!-- The banner image already has text, so we provide an invisible accessible version if needed,
           but mostly we use this space for the CTA buttons -->
    </div>
    <div class="banner-actions">
      <a class="btn" href="{{ site.baseurl }}/vaultstudio/">Explore VaultStudio</a>
      <a class="btn-secondary" href="{{ site.baseurl }}/vouchlink/">Explore VouchLink</a>
    </div>
  </div>
</div>

<script>
// Configuration for particles.js
function initParticles() {
  if (typeof particlesJS === 'undefined') {
    setTimeout(initParticles, 100);
    return;
  }

  const isMobile = window.innerWidth < 768;

  particlesJS('particles-js', {
    particles: {
      number: {
        value: isMobile ? 40 : 80,
        density: { enable: true, value_area: 900 }
      },
      color: { value: ["#1E90FF", "#00BFFF", "#FF4500", "#FF6347", "#FFD700"] },
      shape: { type: ["circle", "triangle"] },
      opacity: {
        value: 0.7,
        random: true,
        anim: { enable: true, speed: 0.5, opacity_min: 0.1, sync: false }
      },
      size: {
        value: isMobile ? 2.5 : 3.5,
        random: true,
        anim: { enable: true, speed: 2, size_min: 0.5, sync: false }
      },
      line_linked: { enable: false },
      move: {
        enable: true,
        speed: isMobile ? 0.6 : 0.8,
        direction: "none",
        random: true,
        straight: false,
        out_mode: "out",
        bounce: false,
        attract: { enable: true, rotateX: 600, rotateY: 1200 }
      }
    },
    interactivity: {
      detect_on: "canvas",
      events: {
        onhover: { enable: !isMobile, mode: "bubble" },
        onclick: { enable: true, mode: "push" },
        resize: true
      },
      modes: {
        bubble: { distance: 100, size: 6, duration: 2, opacity: 1, speed: 3 },
        push: { particles_nb: isMobile ? 2 : 4 }
      }
    },
    retina_detect: true
  });
}

// Re-init on resize to adjust particle count
window.addEventListener('resize', function() {
  if (window.pJSDom && window.pJSDom.length > 0) {
    window.pJSDom[0].pJS.fn.vendors.destroypJS();
    window.pJSDom = [];
  }
  initParticles();
});

document.addEventListener('DOMContentLoaded', initParticles);
</script>
