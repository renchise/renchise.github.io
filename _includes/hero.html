<div class="banner-container">
  <div id="particles-banner"></div>
  <div class="banner-content">
    <div class="banner-actions">
      <a class="btn-secondary" href="{{ site.baseurl }}/vaultstudio/">Explore VaultStudio</a>
      <a class="btn-secondary" href="{{ site.baseurl }}/vouchlink/">Explore VouchLink</a>
    </div>
  </div>
</div>

<script>
// Specific foreground particles for the banner
function initBannerParticles() {
  if (typeof particlesJS === 'undefined') {
    setTimeout(initBannerParticles, 100);
    return;
  }

  const isMobile = window.innerWidth < 768;

  particlesJS('particles-banner', {
    particles: {
      number: {
        value: isMobile ? 60 : 120,
        density: { enable: true, value_area: 500 }
      },
      color: { value: ["#ffffff", "#3db7ff", "#f5c96a", "#ff4500"] },
      shape: { type: ["circle", "triangle"] },
      opacity: {
        value: 0.9,
        random: true,
        anim: { enable: true, speed: 1.5, opacity_min: 0.3, sync: false }
      },
      size: {
        value: isMobile ? 4 : 6,
        random: true,
        anim: { enable: true, speed: 5, size_min: 1.5, sync: false }
      },
      line_linked: { enable: false },
      move: {
        enable: true,
        speed: 2.2,
        direction: "none",
        random: true,
        straight: false,
        out_mode: "out",
        bounce: false
      }
    },
    interactivity: {
      detect_on: "canvas",
      events: {
        onhover: { enable: true, mode: "bubble" },
        onclick: { enable: true, mode: "push" },
        resize: true
      },
      modes: {
        bubble: { distance: 150, size: 8, duration: 2, opacity: 1, speed: 3 },
        push: { particles_nb: 4 }
      }
    },
    retina_detect: true
  });
}

document.addEventListener('DOMContentLoaded', initBannerParticles);
</script>
