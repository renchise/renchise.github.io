<div class="banner-container">
  <div id="particles-banner"></div>
  <div class="banner-content">
    <div class="banner-actions">
      <a class="btn" href="{{ site.baseurl }}/vaultstudio/">Explore VaultStudio</a>
      <a class="btn-secondary" href="{{ site.baseurl }}/vouchlink/">Explore VouchLink</a>
    </div>
  </div>
</div>

<script>
// Specific foreground particles for the banner
function initBannerParticles() {
  if (typeof particlesJS === 'undefined') {
    setTimeout(initBannerParticles, 100);
    return;
  }

  const isMobile = window.innerWidth < 768;

  particlesJS('particles-banner', {
    particles: {
      number: {
        value: isMobile ? 40 : 80,
        density: { enable: true, value_area: 600 }
      },
      color: { value: ["#ffffff", "#3db7ff", "#f5c96a"] },
      shape: { type: "circle" },
      opacity: {
        value: 0.8,
        random: true,
        anim: { enable: true, speed: 1, opacity_min: 0.2, sync: false }
      },
      size: {
        value: isMobile ? 3 : 5,
        random: true,
        anim: { enable: true, speed: 4, size_min: 1, sync: false }
      },
      line_linked: { enable: false },
      move: {
        enable: true,
        speed: 1.5,
        direction: "none",
        random: true,
        straight: false,
        out_mode: "out",
        bounce: false
      }
    },
    interactivity: {
      detect_on: "canvas",
      events: {
        onhover: { enable: true, mode: "bubble" },
        onclick: { enable: true, mode: "push" },
        resize: true
      },
      modes: {
        bubble: { distance: 150, size: 8, duration: 2, opacity: 1, speed: 3 },
        push: { particles_nb: 4 }
      }
    },
    retina_detect: true
  });
}

document.addEventListener('DOMContentLoaded', initBannerParticles);
</script>
